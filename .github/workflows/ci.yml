name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository is a pnpm project (pnpm-lock.yaml, lockfileVersion 9.0) and has no
      # npm lockfile, so the previous actions/setup-node cache:"npm" + `npm ci` never
      # reached a single gate: every run failed at setup-node with
      # "Dependencies lock file is not found".
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11 uses node:sqlite, so it needs Node >= 22. Both are pinned to the
          # toolchain the gates were verified against locally (Node 22 + pnpm 11.6).
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm lint
      - run: pnpm build
